name: Validate dotfiles

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate catalogs and documentation
        run: python tests/installer/validate_catalog.py
      - name: Validate shell syntax
        run: |
          for script in install.sh installer/bash/*.sh tests/installer/test-bash.sh; do
            /bin/bash -n "$script"
          done
      - name: Test native Bash installer
        run: /bin/bash tests/installer/test-bash.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate catalogs and documentation
        run: python tests/installer/validate_catalog.py
      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: .\tests\installer\Test-Installer.ps1
      - name: Test PowerShell 7
        shell: pwsh
        run: .\tests\installer\Test-Installer.ps1
      - name: Test Workbench in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\installer\Test-Workbench.ps1
      - name: Test Workbench in PowerShell 7
        shell: pwsh
        run: .\tests\installer\Test-Workbench.ps1
      - name: Test Terminal profile preservation in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\installer\Test-WindowsTerminal.ps1
      - name: Test Terminal profile preservation in PowerShell 7
        shell: pwsh
        run: .\tests\installer\Test-WindowsTerminal.ps1
      - name: Test workspace discovery and portable configuration
        shell: pwsh
        run: .\tests\wezterm\Verify-WezTerm.ps1
      - name: Check shortcut registry and generated documentation
        run: python tests/wezterm/verify-shortcuts.py
      - name: Check editor workflow when Neovim is available
        shell: pwsh
        run: |
          if (Get-Command nvim -ErrorAction SilentlyContinue) {
            nvim --headless -u NONE -l tests/nvim/verify-editor.lua
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else { Write-Warning 'Neovim is unavailable; editor runtime checks skipped.' }
      - name: Test Git worktrees in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\powershell\Test-GitWorktree.ps1
      - name: Test Git worktrees in PowerShell 7
        shell: pwsh
        run: .\tests\powershell\Test-GitWorktree.ps1
